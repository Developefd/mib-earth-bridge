upstream ge_node {
    # nginx on :80 in front of ge_server.js on 127.0.0.1:PORT
    # 
    # The car's /etc/hosts points kh.google.com at this box, and its URLs are plain
    # http:// -- so it always connects on **port 80**. nginx must own :80; the Node
    # process stays unprivileged on PORT, bound to loopback.
    # 
    # car :80 --> nginx --> 127.0.0.1:PORT (ge_server.js) --> real kh.google.com
    # 
    # Install:
    # sudo cp ge_nginx_node.conf /etc/nginx/sites-available/ge
    # sudo ln -s /etc/nginx/sites-available/ge /etc/nginx/sites-enabled/ge
    # sudo rm -f /etc/nginx/sites-enabled/default       frees port 80
    # sudo nginx -t && sudo systemctl reload nginx
    # 
    # Start the backend with a matching port and a loopback bind:
    # node ge_server.js --port PORT --bind 127.0.0.1 --cache-dir /var/cache/ge
    # (see ge_server.service for a systemd unit)
    # 
    # NEVER put kh.google.com in *this* machine's /etc/hosts -- only the car's.
    # ge_server.js resolves upstream with dns.resolve4(), which ignores the hosts
    # file, but an entry here would still confuse everything else on the box.
    keepalive 32;
    server 127.0.0.1:<PUT YOUR PORT HERE>;
}
server {
    listen 80;
    listen [::]:80;
    server_name kh.google.com;
    access_log /var/log/nginx/ge_access.log;
    error_log /var/log/nginx/ge_error.log warn;
    client_max_body_size 1m;
    # --- deliberately NOT done here ------------------------------------------
    # No proxy_set_header User-Agent. ge_server.js performs the version rewrite,
    # and logs the car's real User-Agent the first time it sees it -- setting a
    # UA here would destroy that signal and apply the rewrite twice.
    # 
    # No proxy_cache. ge_server.js already caches with epoch-aware policy
    # (/flatfile immutable, /dbRoot.v5 on a TTL). A second cache layer here would
    # only add staleness you have to reason about.
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://ge_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        # If Node is restarting, fail fast instead of hanging the head unit.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
    # Stats. Not needed by the car, so keep it off the open path.
    location /_ge {
        proxy_pass http://ge_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }
}
